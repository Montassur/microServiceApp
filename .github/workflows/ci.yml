name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  lint:
    name: Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - admin
          - user-auth
          - catalog
          - order-payment
          - fulfillment
          - shopping
          - platform
          - inventory
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: services/${{ matrix.service }}
        run: npm run lint --if-present

  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-auth
          - catalog
          - order-payment
          - fulfillment
          - shopping
          - platform
          - inventory
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci --no-audit --no-fund

      - name: Test
        working-directory: services/${{ matrix.service }}
        run: npm test --if-present

  build:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - admin
          - gateway
          - user-auth
          - catalog
          - order-payment
          - fulfillment
          - shopping
          - platform
          - inventory
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  k8s-validate:
    name: Validate K8s overlays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Stub production secrets for validation only
        # Real prod secrets stay gitignored — copy the .example so kustomize
        # can render the manifests in CI. CI never deploys these values.
        run: cp infrastructure/k8s/overlays/production/secrets.env.example infrastructure/k8s/overlays/production/secrets.env

      - name: Dry-run production overlay
        run: kubectl kustomize infrastructure/k8s/overlays/production > /tmp/prod.yaml

  # ============================================================================
  # CD — bump the production overlay image tags to the new commit SHA, then
  # commit back so ArgoCD on the VPS picks it up and rolls out. Runs only
  # on push to main, after all 10 images have been built and pushed to GHCR.
  # ============================================================================
  cd-bump-prod-tags:
    name: Bump prod image tags
    runs-on: ubuntu-latest
    needs: [build, k8s-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write   # needed for git push back
    steps:
      - name: Checkout (with token that can push)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Bump every image tag in production kustomization
        run: |
          SHA_TAG="sha-${{ steps.sha.outputs.short }}"
          KUST=infrastructure/k8s/overlays/production/kustomization.yaml
          for svc in frontend admin gateway user-auth catalog order-payment fulfillment shopping platform inventory; do
            # Replace `newTag: <anything>` for this service with the new SHA
            # Each image block looks like:
            #   - name: <svc>
            #     newName: ghcr.io/montassur/microserviceapp/<svc>
            #     newTag: main           ← this line is what we replace
            python3 - <<PY
          import re, pathlib
          path = pathlib.Path("$KUST")
          text = path.read_text()
          # Locate the block for this service and rewrite its newTag
          pattern = r"(- name: $svc\n    newName: ghcr\.io/montassur/microserviceapp/$svc\n    newTag: )\S+"
          text2 = re.sub(pattern, lambda m: m.group(1) + "$SHA_TAG", text)
          path.write_text(text2)
          PY
          done
          echo "=== diff ==="
          git diff $KUST | head -40

      - name: Commit and push if changed
        run: |
          git config user.email "ci@ecommerce.local"
          git config user.name "GitHub Actions CD"
          if git diff --quiet infrastructure/k8s/overlays/production/kustomization.yaml; then
            echo "no image tag changes — skipping commit"
            exit 0
          fi
          git add infrastructure/k8s/overlays/production/kustomization.yaml
          git commit -m "cd: pin prod images to sha-${{ steps.sha.outputs.short }} [skip ci]

Triggered by source commit ${{ github.sha }}
ArgoCD on the VPS will pick this up and roll out the new pods."
          git push
