services:
  frontend:
    ports: !override
      - "9080:80"
    # Local-only nginx config — uses Docker DNS so gateway hostname
    # resolves at request time. Production image is unaffected.
    volumes:
      - ./services/frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

  admin:
    ports: !override
      - "8081:80"
    volumes:
      - ./services/admin/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

  gateway:
    # Local-only nginx config — uses Docker DNS for frontend/admin so
    # gateway can start before they exist. Production image is unaffected.
    volumes:
      - ./services/gateway/nginx.local.conf:/etc/nginx/nginx.conf:ro
    # Break the circular dependency: gateway no longer waits for
    # frontend/admin (because nginx now lazily resolves them).
    depends_on: !override
      catalog:
        condition: service_healthy
      order-payment:
        condition: service_healthy
      user-auth:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.2.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.0
    container_name: grafana
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
