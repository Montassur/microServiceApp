apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'docker-desktop'
        environment: 'development'

    scrape_configs:
      - job_name: 'microservices'
        metrics_path: '/metrics'
        static_configs:
          - targets:
              - 'user-auth.ecommerce-dev.svc.cluster.local:3000'
              - 'catalog.ecommerce-dev.svc.cluster.local:3001'
              - 'order-payment.ecommerce-dev.svc.cluster.local:3002'
              - 'fulfillment.ecommerce-dev.svc.cluster.local:3003'
              - 'shopping.ecommerce-dev.svc.cluster.local:3004'
              - 'platform.ecommerce-dev.svc.cluster.local:3005'
              - 'inventory.ecommerce-dev.svc.cluster.local:3006'
            labels:
              group: 'backend-services'

      - job_name: 'rabbitmq'
        metrics_path: '/metrics'
        static_configs:
          - targets:
              - 'rabbitmq.ecommerce-dev.svc.cluster.local:15692'
            labels:
              group: 'infrastructure'

      - job_name: 'prometheus'
        static_configs:
          - targets:
              - 'localhost:9090'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.2.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=15d'
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
