apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # gateway.yaml (Gateway API) removed — we use regular Ingress in prod
  # and Gateway API CRDs are not installed on the production cluster.
  - ingress.yaml
  - sealed-secret.yaml

namespace: ecommerce-prod

labels:
  - pairs:
      environment: production

# Pull production images from GHCR (built + pushed by GitHub Actions CI).
# Tag `main` = latest stable from main branch. To pin to a specific commit,
# change to `sha-<short-sha>` after the CI build.
images:
  - name: frontend
    newName: ghcr.io/montassur/microserviceapp/frontend
    newTag: sha-b2f50b4
  - name: admin
    newName: ghcr.io/montassur/microserviceapp/admin
    newTag: sha-b2f50b4
  - name: gateway
    newName: ghcr.io/montassur/microserviceapp/gateway
    newTag: sha-b2f50b4
  - name: user-auth
    newName: ghcr.io/montassur/microserviceapp/user-auth
    newTag: sha-b2f50b4
  - name: catalog
    newName: ghcr.io/montassur/microserviceapp/catalog
    newTag: sha-b2f50b4
  - name: order-payment
    newName: ghcr.io/montassur/microserviceapp/order-payment
    newTag: sha-b2f50b4
  - name: fulfillment
    newName: ghcr.io/montassur/microserviceapp/fulfillment
    newTag: sha-b2f50b4
  - name: shopping
    newName: ghcr.io/montassur/microserviceapp/shopping
    newTag: sha-b2f50b4
  - name: platform
    newName: ghcr.io/montassur/microserviceapp/platform
    newTag: sha-b2f50b4
  - name: inventory
    newName: ghcr.io/montassur/microserviceapp/inventory
    newTag: sha-b2f50b4

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_LEVEL
          value: info
  # Switch backend service imagePullPolicy from IfNotPresent to Always so
  # ArgoCD picks up new image pushes for the same `:main` tag.
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
