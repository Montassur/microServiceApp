---
# RabbitMQ Management UI — same Service runs AMQP (5672), Management UI
# (15672) and Prometheus metrics (15692). This Ingress routes the public
# subdomain to the management port. RabbitMQ has its own login.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rabbitmq-management
  namespace: ecommerce-prod
spec:
  ingressClassName: nginx
  rules:
    - host: rabbitmq.monta.dev.montassar-benaziza.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  number: 15672
