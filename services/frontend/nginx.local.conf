# LOCAL-ONLY nginx config for Docker Compose. Mounted via
# docker-compose.override.yml; NEVER baked into the prod image.
# Difference from nginx.conf: uses Docker's embedded DNS resolver
# (127.0.0.11) so the "gateway" hostname is resolved at request time
# instead of nginx startup — avoids the chicken-and-egg startup race.
server {
    listen 80;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self';";

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $gateway_upstream "gateway";
    location /api/ {
        # When proxy_pass uses a variable, nginx passes the full request
        # URI unchanged (don't append /api/ here or you get /api//api/...)
        proxy_pass http://$gateway_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
